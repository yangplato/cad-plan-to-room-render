name: Validate scene tools

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional DXF test dependency
        run: python -m pip install --disable-pip-version-check "ezdxf==1.4.4"
      - name: Run unit and synthetic DXF integration tests
        run: python -m unittest discover -s tests -v
