interface:
  display_name: "住宅彩平与空间方案"
  short_description: "整理住宅平面，结合空间约束图与造型库生成彩平和可供风格评判的效果图"
  default_prompt: "使用 $cad-plan-to-room-render 帮我处理住宅平面。先看我提供的资料，按原始资料识别、整理平面、彩平、房间效果图四步引导。在对话中展示实际成果和完整生图提示词，收到我的回复确认后再继续；不另建审阅页或确认文件。效果图用空间约束图保留布局，用随包造型库补全设计；整体方案可供评判就交付，仅修正影响空间、使用或整体完成度的问题。如果还没有资料，先告诉我如何开始。"
